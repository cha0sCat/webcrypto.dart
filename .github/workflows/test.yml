name: test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  lints:
    name: Format + Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart format --output none --set-exit-if-changed .
      - run: dart analyze --fatal-warnings .
  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter pub run webcrypto:setup
      - run: flutter test
      - run: xvfb-run flutter test integration_test/webcrypto_test.dart -d linux
        working-directory: ./example
      - run: xvfb-run flutter pub run test -p vm
  macos-14:
    name: MacOS 14 desktop
    runs-on: macos-14 # Test with xcode 15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter pub run webcrypto:setup
      - run: flutter test
      - run: flutter test integration_test/webcrypto_test.dart -d macos
        working-directory: ./example
      - run: flutter pub run test -p vm
  macos-15:
    name: MacOS 15 desktop
    runs-on: macos-15 # Test with xcode 16
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter pub run webcrypto:setup
      - run: flutter test
      - run: flutter test integration_test/webcrypto_test.dart -d macos
        working-directory: ./example
      - run: flutter pub run test -p vm
  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter pub run webcrypto:setup
      - run: flutter test
      - run: flutter test integration_test/webcrypto_test.dart -d windows
        working-directory: ./example
      - run: flutter pub run test -p vm
  ios:
    name: iOS emulator (iPhone)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - uses: futureware-tech/simulator-action@v3
        with:
          model: 'iPhone 15'
      - run: flutter pub get
      - run: flutter test integration_test/webcrypto_test.dart -d iphone
        working-directory: ./example
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run flutter test integration_test/webcrypto_test.dart -d emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # TODO: switch back to default once this is issue resolved:
          # https://issuetracker.google.com/issues/432143095
          target: google_apis
          arch: x86_64
          working-directory: ./example
          script: flutter test integration_test/webcrypto_test.dart -d emulator
  linux-coverage:
    name: Linux desktop (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter pub run webcrypto:setup
      - run: xvfb-run flutter pub run test -p vm --coverage ./coverage
      # Report collected coverage
      - name: Convert coverage to lcov
        run: dart run coverage:format_coverage -i ./coverage -o ./coverage/lcov.info --lcov --report-on lib/
      - uses: coverallsapp/github-action@v2
        with:
          flag-name: linux
          parallel: true
  windows-coverage:
    name: Windows desktop (coverage)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter pub run webcrypto:setup
      - run: flutter pub run test -p vm --coverage ./coverage
      # Report collected coverage
      - name: Convert coverage to lcov
        run: dart run coverage:format_coverage -i ./coverage -o ./coverage/lcov.info --lcov --report-on lib/
      - uses: coverallsapp/github-action@v2
        with:
          flag-name: windows
          parallel: true
  coverage:
    name: Report to coveralls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - linux-coverage
      - windows-coverage
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
